; pytest 配置
;
; 目录结构（各层相互独立）：
;   scripts/     入口脚本 —— run.py / run_unit.py / new_case.py / to_excel.py / serve_report.py
;   testcases/   用例层 —— 用例数据 + 用例执行逻辑
;   framework/   pytest 插件层 —— 收集 / 钩子 / fixture / 报告
;   utils/       封装层 —— 按职责分子包（http / assertions / cases / config / logs / slider / infra）
;   verify/      校验层 —— 数据库 / 缓存 / MQ 断言
;   factory/     测试数据工厂
;   adapters/    被测系统适配（登录等）
;   ai/          AI 能力层 —— 用例生成 / 缺陷分析 / 智能体工具 / MCP 服务
;   tools/       维护与导入工具（importer / maint）
;   configs/     配置层 —— config.yaml / modules.yaml / factories.yaml
;   unit_tests/  单元测试层 —— 框架自己的单测（不需要网络）
;   ci/          CI 统一入口
;   logs/  reports/  data/   运行产物
;
; 怎么跑：
;   python scripts/run.py          # 接口用例（要网络，要登录）
;   python scripts/run_unit.py     # 单元测试（不要网络，秒出结果）
;   pytest                         # 等价于跑 unit_tests
;
; ⚠️ testpaths 指向 unit_tests。
;
; 裸跑 ``pytest`` 只跑框架单测（不联网、几秒钟出结果）；
; 想跑接口用例用 ``python scripts/run.py``。
[pytest]
testpaths = unit_tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
; ⚠️ 不要加 --maxfail=1
;
; 接口自动化里"一条挂了就不跑了"是要命的：
;   - 挂的那条往往是登录/滑块这类带超时的用例，一挂就是几十分钟
;   - 后面几十条正常用例全没跑，报告上看着像"全挂了"，其实是没跑
;
; 全部跑完再看哪些失败，才是接口自动化该有的样子。
; 只想看失败的那些用例，跑完用报告筛就行。
addopts = -v -s
; 日志：写 logs/test.log + 控制台
log_level = INFO
log_file = logs/test.log
log_file_level = DEBUG
log_format = %(asctime)s [%(levelname)s] %(name)s: %(message)s

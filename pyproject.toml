[project]
name = "pythonproject"
version = "0.1.0"
description = "mall4j admin 接口自动化测试框架（Excel/YAML 数据驱动 + 滑块登录 + 查库校验 + AI 辅助）"
requires-python = ">=3.12"

# 依赖统一维护在 requirements.txt，这里只做声明，不重复列。
# 安装：uv pip install -r requirements.txt
dependencies = [
    "requests>=2.32.0",
    "pytest>=8.0.0",
    "pyyaml>=6.0",
    "numpy>=1.26.0",
    "opencv-python>=4.9.0",
    "playwright>=1.64.1",
    "allure-pytest>=2.13.0",
    "pytest-html>=4.1.0",
]

[project.optional-dependencies]
# 需要 mysql 断言 / setup / teardown 时才装
mysql = ["mysql-connector-python>=8.0.33"]
# 滑块缺口的 OCR 兜底方案
ocr = ["ddddocr>=1.6.0"]
# 缓存校验（redis_* 断言）
redis = ["redis>=5.0.0"]
# 消息队列校验（mq_* 断言）
mq = ["pika>=1.3.2", "kafka-python>=2.0.2"]
# 并行跑用例（pytest -n 4）
xdist = ["pytest-xdist>=3.6.0"]
# 全部可选依赖
all = [
    "mysql-connector-python>=8.0.33",
    "redis>=5.0.0",
    "pika>=1.3.2",
    "kafka-python>=2.0.2",
    "pytest-xdist>=3.6.0",
]

# 注意：pytest 配置统一放在根目录的 pytest.ini，
# 不要在这里再写 [tool.pytest.ini_options] —— 两份配置会冲突，
# pytest 会警告 "ignoring pytest config in pyproject.toml"。

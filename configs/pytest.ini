; 接口自动化框架的 pytest 配置（独立于项目根目录）
[pytest]
testpaths = .
python_files = test_*.py
python_functions = test_*
addopts = -v -s

; 让用例 ID 里的中文正常显示（默认会被转义成 \uXXXX）
;
; ⚠️ 值必须写小写的 true —— pytest 的 bool 解析器只认
;    true/false/1/0/yes/no，写成 True 会被当成无效值而静默退回 False
disable_test_id_escaping_and_forfeit_all_rights_to_community_support = true

log_level = INFO
log_cli_level = INFO
